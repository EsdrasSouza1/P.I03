<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f7f3">
  <title>Criar conta — Bartarin Imóveis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page">
  <header class="auth-header"><a class="brand" href="/"><span class="brand-mark">B</span><span>bartarin<span class="brand-dot">.</span><small class="brand-subtitle">IMÓVEIS · ARARAS</small></span></a><a class="back-link" href="/">← Voltar ao portal</a></header>
  <main class="auth-layout"><section class="auth-visual"><img src="https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?auto=format&fit=crop&w=1100&q=85" alt="Casa com jardim e espaços acolhedores"><div><span>SUA JORNADA COMEÇA AQUI</span><h1>Encontre o espaço<br>para sua próxima <em>história.</em></h1></div></section>
    <section class="auth-card"><div class="eyebrow"><span class="eyebrow-line"></span> CADASTRO DE CLIENTE</div><h2>Crie sua <em>conta.</em></h2><p>Salve imóveis favoritos e acompanhe seus contatos.</p>
      <form class="auth-form" data-auth-form="register"><label>Nome completo<input name="nome" autocomplete="name" placeholder="Seu nome" required minlength="2"></label><label>E-mail<input type="email" name="email" autocomplete="email" placeholder="voce@email.com" required></label><label>Telefone<input type="tel" name="telefone" autocomplete="tel" placeholder="(19) 99999-9999"></label><label>Senha<span class="password-wrap"><input type="password" name="senha" autocomplete="new-password" placeholder="Mínimo de 8 caracteres" required minlength="8"><button type="button" class="show-password" aria-label="Mostrar senha">◉</button></span></label><label class="terms-check"><input type="checkbox" required><span>Concordo com o uso dos meus dados para atendimento imobiliário.</span></label><button class="button button-dark auth-submit" type="submit">Criar conta <span>↗</span></button><p class="form-message" aria-live="polite"></p></form>
      <p class="auth-foot">Já tem uma conta? <a href="/login.html">Entrar</a></p><div class="prototype-notice">Demonstração visual. Seus dados não serão enviados nem armazenados.</div>
    </section>
  </main>
  <script src="/auth.js" defer></script>
</body>
</html>
