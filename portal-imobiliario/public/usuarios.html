<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f3">
  <title>Gestão de usuários — Bartarin Imóveis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="admin-protected">
  <header class="topbar"><a class="brand" href="/admin.html"><span class="brand-mark">B</span><span>bartarin<span class="brand-dot">.</span><small class="brand-subtitle">IMÓVEIS · ARARAS</small></span></a><nav class="nav-links"><a href="/admin.html">Imóveis</a><a class="active" href="/usuarios.html">Usuários</a></nav><div class="admin-header-actions"><div class="admin-user-menu" data-admin-user-menu><button class="admin-user-trigger" type="button" aria-haspopup="true" aria-expanded="false"><span data-admin-user-name>Usuário</span><svg class="menu-chevron" aria-hidden="true" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg><svg class="admin-user-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button><div class="admin-user-dropdown" hidden><button type="button" data-change-password><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Alterar senha</button><button type="button" data-admin-logout><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/></svg>Sair</button></div></div></div></header>
  <main class="admin-page users-page">
    <section class="admin-heading"><div><div class="eyebrow"><span class="eyebrow-line"></span> CONTROLE DE ACESSO</div><h1>Gerencie seus <em>usuários.</em></h1><p>Cadastre e mantenha os acessos à área administrativa.</p></div><span class="connection-pill" id="users-connection-status">Verificando API</span></section>
    <div class="admin-layout">
      <section class="admin-panel listing-panel"><div class="panel-heading"><div><span class="panel-kicker">USUÁRIOS</span><h2>Usuários cadastrados</h2></div><div class="catalog-tools"><label class="catalog-filter"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="user-filter" type="search" placeholder="Filtrar por palavra-chave" aria-label="Filtrar usuários por palavra-chave"></label><button id="refresh-users" class="button refresh-button" type="button">Atualizar <span>↻</span></button><button id="add-user" class="button add-property-button" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Adicionar</button></div></div><div id="user-list" class="admin-property-list"><div class="admin-empty">Carregando usuários…</div></div></section>
    </div>
  </main>

  <dialog id="user-dialog" class="user-dialog">
    <div class="edit-workspace-heading"><div><span class="panel-kicker">CADASTRO DE USUÁRIO</span><h2 id="user-form-title">Novo usuário</h2></div><button class="quiet-button" id="close-user-dialog" type="button">Fechar ✕</button></div>
    <form id="user-form" class="user-form">
      <label>Nome completo<input name="nome" required minlength="2" maxlength="120" autocomplete="name" placeholder="Nome do usuário"></label>
      <label>E-mail<input name="email" required type="email" autocomplete="email" placeholder="usuario@email.com"></label>
      <label>Nome de usuário<input name="usuario" required maxlength="50" autocomplete="username" placeholder="usuario"></label>
      <label>Senha<input name="senha" type="password" autocomplete="new-password" placeholder="Informe uma senha"></label>
      <small id="password-hint" class="wide">A senha é obrigatória no novo cadastro.</small>
      <div class="form-actions wide"><p class="form-message" id="user-form-message" aria-live="polite"></p><div><button class="button button-outline" id="cancel-user" type="button">Cancelar</button><button class="button button-dark" type="submit"><span id="user-submit-label">Cadastrar usuário</span><b>↗</b></button></div></div>
    </form>
  </dialog>
  <script src="/admin-auth.js" defer></script><script src="/usuarios.js" defer></script>
</body>
</html>
