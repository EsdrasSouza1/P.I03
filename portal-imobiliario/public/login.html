<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f7f3">
  <title>Entrar — Bartarin Imóveis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page login-page">
  <header class="auth-header"><a class="brand" href="/"><span class="brand-mark">B</span><span>bartarin<span class="brand-dot">.</span><small class="brand-subtitle">IMÓVEIS · ARARAS</small></span></a><a class="back-link" href="/">← Voltar ao portal</a></header>
  <main class="auth-layout"><section class="auth-visual"><img src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1100&q=85" alt="Ambiente de uma casa iluminado pelo sol"><div><span>ÁREA DE ACESSO</span><h1>Um bom atendimento<br>começa com <em>cuidado.</em></h1></div></section>
    <section class="auth-card"><div class="eyebrow"><span class="eyebrow-line"></span> BEM-VINDO DE VOLTA</div><h2>Acesse sua <em>conta.</em></h2><p>Entre para acompanhar seus imóveis e atendimentos.</p>
      <div id="active-session-panel" class="active-session-card hidden" aria-live="polite">
        <div class="active-session-user">
          <span class="active-session-avatar" id="session-avatar">U</span>
          <div class="active-session-details">
            <strong id="session-user-name">Usuário conectado</strong>
            <small id="session-user-email"></small>
          </div>
        </div>
        <div class="active-session-actions">
          <button type="button" class="button button-outline" id="logout-button">Sair da conta</button>
          <a class="button button-dark" href="/admin.html">Ir para o painel ↗</a>
        </div>
      </div>
      <form class="auth-form" data-auth-form="login" novalidate><label>E-mail<span class="auth-input-wrap"><svg class="auth-field-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input type="email" name="email" autocomplete="email" placeholder="voce@email.com" required></span></label><label>Senha<span class="password-wrap auth-input-wrap"><svg class="auth-field-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input type="password" name="senha" autocomplete="current-password" placeholder="Sua senha" required minlength="8"><button type="button" class="show-password" aria-label="Mostrar senha">◉</button></span></label><div class="auth-inline"><label class="remember-check"><input type="checkbox" name="lembrar"><span>Manter conectado</span></label><a href="/recuperar-senha.html">Esqueci minha senha</a></div><div class="auth-actions"><a class="button button-outline auth-submit" href="/"><svg class="auth-button-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/><path d="M9 12h11"/></svg>Voltar</a><button class="button button-dark auth-submit" type="submit"><svg class="auth-button-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/></svg><span class="submit-label">Entrar</span></button></div><p class="form-message" aria-live="polite"></p></form>
      <p class="auth-foot admin-portal-link"><a href="/admin.html">Portal administrativo</a></p>
    </section>
  </main>
  <script src="/auth.js" defer></script>
</body>
</html>
